<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Les voitures dans le garage</title>
<style>
:root { --ink:#24435a; --sky:#dff5ff; --yellow:#ffd85c; --red:#ef5b5b; --blue:#3d98e8; --mint:#63d5a6; }
* { box-sizing:border-box; }
html,body { margin:0; width:100%; min-height:100%; font-family:Arial,sans-serif; color:var(--ink); }
body { background:linear-gradient(135deg,#eaf9ff,#fffdf5); min-height:100vh; overflow-x:hidden; }
.app { min-height:100vh; padding:clamp(12px,2.5vw,28px); display:flex; flex-direction:column; gap:14px; }
header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
h1 { margin:0; font-size:clamp(23px,3vw,36px); color:var(--ink); }
.subtitle { margin:4px 0 0; font-size:clamp(13px,1.6vw,17px); }
.reset { border:0; border-radius:18px; background:var(--yellow); color:var(--ink); font-weight:800; font-size:clamp(14px,1.7vw,18px); padding:13px 18px; box-shadow:0 4px 0 #e4b938; cursor:pointer; touch-action:manipulation; }
.reset:active { transform:translateY(3px); box-shadow:0 1px 0 #e4b938; }
.workspace { flex:1; display:grid; grid-template-columns:minmax(150px,220px) minmax(280px,1fr); gap:clamp(12px,3vw,34px); align-items:center; max-width:1100px; width:100%; margin:0 auto; }
.palette { background:#fff; border:3px solid #cdebf5; border-radius:24px; padding:14px 12px; display:flex; flex-direction:column; gap:14px; align-items:center; box-shadow:0 5px 0 #cdebf5; }
.palette h2 { font-size:clamp(16px,2vw,21px); margin:0; text-align:center; }
.source { width:min(100%,185px); min-height:92px; display:flex; align-items:center; justify-content:center; border-radius:16px; background:#f5fbff; border:2px dashed #b6dce9; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
.source img { width:100%; max-width:170px; height:auto; pointer-events:none; }
.source:active { cursor:grabbing; }
.hint { font-size:13px; line-height:1.35; text-align:center; margin:0; }
.garage-area { display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0; }
.garage-area h2 { margin:0; font-size:clamp(18px,2.2vw,24px); }
.garage-wrap { position:relative; width:min(100%,650px); touch-action:pan-y; }
.garage-img { display:block; width:100%; height:auto; pointer-events:none; user-select:none; }
.drop-zone { position:absolute; inset:0; overflow:visible; }
.placed-car { position:absolute; width:clamp(75px,14vw,125px); height:auto; transform:translate(-50%,-50%); cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-drag:none; filter:drop-shadow(0 2px 1px #ffffffaa); }
.placed-car:focus { outline:3px solid #24435a; border-radius:10px; }
.drag-ghost { position:fixed; z-index:9999; width:clamp(90px,15vw,130px); height:auto; pointer-events:none; transform:translate(-50%,-50%); opacity:.92; }
.counts { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; font-weight:800; font-size:clamp(13px,1.6vw,17px); }
.count { background:white; border-radius:14px; padding:8px 12px; box-shadow:0 2px 0 #d4e9ef; }
.count.blue { border:2px solid var(--blue); }
.count.red { border:2px solid var(--red); }
.count.total { border:2px solid var(--mint); }
@media (max-width:620px) {
 .workspace { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
 .palette { flex-direction:row; flex-wrap:wrap; justify-content:center; padding:10px; }
 .palette h2 { width:100%; }
 .source { width:min(42%,175px); min-height:75px; }
 .source img { max-width:145px; }
 .hint { width:100%; }
 .garage-wrap { width:min(100%,520px); }
}
</style>
</head>

const zone = document.getElementById('dropZone');
const garage = document.getElementById('garage');
const counts = { blue: document.getElementById('blueCount'), red: document.getElementById('redCount'), total: document.getElementById('totalCount') };
let cars = [];
let drag = null;
let nextId = 1;

function updateCounts() {
  const blue = cars.filter(c => c.color === 'blue').length;
  const red = cars.filter(c => c.color === 'red').length;
  counts.blue.textContent = `🔵 Bleues : ${blue}`;
  counts.red.textContent = `🔴 Rouges : ${red}`;
  counts.total.textContent = `🚗 Total : ${cars.length}`;
}
function addCar(color, x, y) {
  const el = document.createElement('img');
  el.src = images[color];
  el.alt = `Voiture ${color === 'blue' ? 'bleue' : 'rouge'} déposée. Toucher pour retirer.`;
  el.className = 'placed-car';
  el.draggable = false;
  el.tabIndex = 0;
  el.style.left = `${x * 100}%`;
  el.style.top = `${y * 100}%`;
  const car = { id: nextId++, color, x, y, el };
  el.addEventListener('click', e => { e.stopPropagation(); removeCar(car.id); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); removeCar(car.id); } });
  zone.appendChild(el);
  cars.push(car);
  updateCounts();
}
function removeCar(id) {
  const index = cars.findIndex(c => c.id === id);
  if (index < 0) return;
  cars[index].el.remove();
  cars.splice(index, 1);
  updateCounts();
}
function pointInZone(clientX, clientY) {
  const r = garage.getBoundingClientRect();
  return clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom;
}
function relativePoint(clientX, clientY) {
  const r = zone.getBoundingClientRect();
  return { x: Math.max(.08, Math.min(.92, (clientX-r.left)/r.width)), y: Math.max(.25, Math.min(.88, (clientY-r.top)/r.height)) };
}
function defaultPoint() {
  // Disposition en rangées pour faciliter l'observation et le dénombrement.
  const i = cars.length;
  const columns = 4;
  const col = i % columns;
  const row = Math.floor(i / columns);
  return { x: .30 + col * .16, y: Math.min(.84, .56 + row * .105) };
}
function addAtDefault(color) {
  const p = defaultPoint();
  addCar(color, p.x, p.y);
}
function startDrag(source, event) {
  if (event.button !== undefined && event.button !== 0) return;
  event.preventDefault();
  const color = source.dataset.color;
  const ghost = document.createElement('img');
  ghost.src = images[color];
  ghost.className = 'drag-ghost';
  document.body.appendChild(ghost);
  drag = { color, ghost, startX: event.clientX, startY: event.clientY, moved: false };
  moveGhost(event.clientX, event.clientY);
  const move = e => {
    if (!drag) return;
    if (Math.hypot(e.clientX-drag.startX, e.clientY-drag.startY) > 8) drag.moved = true;
    moveGhost(e.clientX, e.clientY);
  };
  const end = e => {
    if (!drag) return;
    const current = drag;
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', end);
    document.removeEventListener('pointercancel', cancel);
    current.ghost.remove();
    drag = null;
    if (pointInZone(e.clientX, e.clientY)) {
      const p = current.moved ? relativePoint(e.clientX, e.clientY) : defaultPoint();
      addCar(current.color, p.x, p.y);
    } else if (!current.moved) {
      addAtDefault(current.color);
    }
  };
  const cancel = () => {
    if (!drag) return;
    drag.ghost.remove(); drag = null;
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', end);
    document.removeEventListener('pointercancel', cancel);
  };
  document.addEventListener('pointermove', move, { passive:false });
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', cancel);
}
function moveGhost(x,y) {
  if (!drag) return;
  drag.ghost.style.left = `${x}px`;
  drag.ghost.style.top = `${y}px`;
}
document.querySelectorAll('.source').forEach(source => {
  source.addEventListener('pointerdown', e => startDrag(source, e));
  source.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); addAtDefault(source.dataset.color); }
  });
});
document.getElementById('reset').addEventListener('click', () => {
  cars.forEach(c => c.el.remove());
  cars = [];
  updateCounts();
});
updateCounts();
</script>
